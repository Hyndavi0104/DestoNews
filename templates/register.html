{% extends 'base.html' %}
{% block title %}Register - DestoNews{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card p-4 shadow-lg register-card animate__animated animate__fadeInDown" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Register</h3>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" class="form-control my-2 form-input" placeholder="Username">
            <input type="password" name="password1" class="form-control my-2 form-input" placeholder="Password">
            <input type="password" name="password2" class="form-control my-2 form-input" placeholder="Confirm Password">
            <button type="submit" class="btn btn-success w-100 mt-3 btn-hover">Register</button>
        </form>

        <p class="mt-3 text-center">
            Already have an account? <a href="{% url 'login' %}">Login</a>
        </p>
    </div>
</div>

<style>
/* Card hover animation */
.register-card {
    border-radius: 12px;
    transition: transform 0.3s, box-shadow 0.3s;
}
.register-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

/* Input focus effect */
.form-input:focus {
    border-color: #28a745;
    box-shadow: 0 0 5px rgba(40,167,69,0.5);
    outline: none;
}

/* Button hover */
.btn-hover {
    transition: transform 0.2s, background-color 0.2s;
}
.btn-hover:hover {
    transform: scale(1.05);
    background-color: #218838;
}
</style>

<!-- Animate.css CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
{% endblock %}
